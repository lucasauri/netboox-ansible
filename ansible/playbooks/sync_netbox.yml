---
# Playbook: Sincronizar informações de dispositivos com Netbox
# Descrição: Coleta e sincroniza dados de hosts com API Netbox

- name: Sincronizar dados com Netbox
  hosts: all
  gather_facts: yes
  
  vars:
    netbox_url: "{{ lookup('env', 'NETBOX_URL') | default('http://netbox:8000') }}"
    netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
  
  pre_tasks:
    - name: Validar token Netbox
      fail:
        msg: "NETBOX_TOKEN não definido. Exporte a variável de ambiente."
      when: not netbox_token
  
  tasks:
    - name: Coletar informações do host
      debug:
        msg: |
          Hostname: {{ inventory_hostname }}
          IP: {{ ansible_host }}
          OS: {{ ansible_os_family | default('unknown') }}
    
    - name: Preparar payload para Netbox
      set_fact:
        device_payload:
          status: "active"
          comments: "Sincronizado por Ansible"
    
    - name: Atualizar dispositivo em Netbox
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/{{ device_id }}/"
        method: PATCH
        headers:
          Authorization: "Token {{ netbox_token }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ device_payload }}"
        validate_certs: no
        status_code: [200]
      register: netbox_response
      when: device_id is defined
      failed_when: netbox_response.status != 200
    
    - name: Log de sucesso
      debug:
        msg: "Dispositivo {{ inventory_hostname }} atualizado"
      when: device_id is defined
