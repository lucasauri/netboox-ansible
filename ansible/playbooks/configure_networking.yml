---
# Playbook: Configurar dispositivos de rede
# Descrição: Validar e preparar equipamentos de rede

- name: Preparar dispositivos de rede
  hosts: networking
  gather_facts: no
  
  tasks:
    - name: Testar conectividade SSH
      wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: started
        timeout: 10
      register: ssh_check
      ignore_errors: yes
    
    - name: Host acessível
      debug:
        msg: "Dispositivo {{ inventory_hostname }} está acessível via SSH"
      when: ssh_check is succeeded
    
    - name: Falha na conectividade
      fail:
        msg: "Não foi possível conectar em {{ inventory_hostname }}. Verifique IP e credenciais."
      when: ssh_check is failed
