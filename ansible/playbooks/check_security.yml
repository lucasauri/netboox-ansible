---
# Playbook: Verificar integridade de segurança
# Descrição: Executa validações reais no estado do filtro de pacotes do firewall

- name: Verificar integridade de segurança
  hosts: security
  gather_facts: no
  
  tasks:
    - name: Validar estado ativo do filtro de pacotes (pfSense/BSD)
      command: pfctl -si
      register: firewall_status
      changed_when: false

    - name: Verificar integridade das regras carregadas
      command: pfctl -s rules
      register: firewall_rules
      changed_when: false

    - name: Exibir sumário de integridade
      debug:
        msg: 
          - "Firewall Host: {{ inventory_hostname }}"
          - "Status do Filtro: {{ 'Ativo' if 'Enabled' in firewall_status.stdout else 'Atenção/Inativo' }}"
