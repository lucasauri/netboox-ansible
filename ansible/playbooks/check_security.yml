---
# Playbook: Verificar status de segurança
# Descrição: Validar conectividade com equipamentos de segurança

- name: Validar equipamentos de segurança
  hosts: security
  gather_facts: no
  
  tasks:
    - name: Testar conectividade
      wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: started
        timeout: 10
      register: firewall_check
      ignore_errors: yes
    
    - name: Dispositivo respondendo
      debug:
        msg: "Firewall {{ inventory_hostname }} está online"
      when: firewall_check is succeeded
    
    - name: Dispositivo não respondendo
      debug:
        msg: "AVISO: Firewall {{ inventory_hostname }} não responde em SSH"
      when: firewall_check is failed
