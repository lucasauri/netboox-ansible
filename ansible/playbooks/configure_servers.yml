---
# Playbook: Configurar servidores
# Descrição: Aplica configurações básicas em servidores (Linux/Windows)

- name: Configurar servidores
  hosts: servers
  gather_facts: yes
  become: yes
  
  tasks:
    - name: Atualizar pacotes (Linux)
      package:
        name: "*"
        state: latest
      when: ansible_os_family in ['Debian', 'RedHat']
      ignore_errors: yes
    
    - name: Instalar ferramentas de monitoramento (Linux)
      package:
        name:
          - net-tools
          - curl
          - wget
          - htop
        state: present
      when: ansible_os_family in ['Debian', 'RedHat']
      ignore_errors: yes
    
    - name: Exibir informações do servidor
      debug:
        msg: |
          Servidor: {{ inventory_hostname }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Memória: {{ ansible_memtotal_mb }}MB
          CPU Cores: {{ ansible_processor_vcpus }}
