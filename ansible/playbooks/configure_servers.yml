---
# Playbook: Configurar servidores
# Descrição: Aplica configurações base em ambientes Linux de forma estrita

- name: Configurar servidores
  hosts: servers
  gather_facts: yes
  become: yes
  
  tasks:
    - name: Atualizar repositórios e pacotes do sistema
      package:
        name: "*"
        state: latest

    - name: Garantir ferramentas essenciais de diagnóstico
      package:
        name:
          - net-tools
          - curl
          - wget
          - htop
        state: present
